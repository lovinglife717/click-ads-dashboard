<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071510"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><title>Click Ads Dashboard</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><span class="logo">◈</span><div><strong>Click Ads</strong><small>PRIVATE USDT DASHBOARD</small></div></div><span class="status">● LOCAL ONLY</span></header>
<main id="main"></main><nav id="nav" aria-label="Main navigation"></nav><div id="toast" role="status"></div><script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js', {
        updateViaCache: 'none'
      });
      await registration.update();
      window.addEventListener('pageshow', () => {
        registration.update().catch(() => {});
      });
    } catch (error) {
      console.warn('Offline updates unavailable:', error);
    }
  });
}
</script>
</body></html>
